name: Standalone playback validation

on:
  push:
    branches:
      - refactor/standalone-playback-sources
    paths-ignore:
      - standalone-validation-result.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate standalone playback refactor
        shell: bash
        run: |
          set +e
          touch local.properties
          chmod +x gradlew

          ./gradlew tasks --all > /tmp/gradle-tasks.log 2>&1
          TASKS_RC=$?

          ./gradlew build > /tmp/full-build.log 2>&1
          BUILD_RC=$?

          ./gradlew makePluginsJson > /tmp/make-plugins.log 2>&1
          MAKE_RC=$?

          for M in Adicinemax21 AdiXtream AdiDrakor AdiFilmSemi; do
            ./gradlew ":$M:build" > "/tmp/$M-build.log" 2>&1
            eval "${M}_RC=$?"
          done

          STATIC_RC=0
          for M in AdiXtream AdiDrakor AdiFilmSemi; do
            if grep -R -n -E 'import com\.Adicinemax21|Adicinemax21/src/main/kotlin|project\(["'"']?:Adicinemax21' "$M" > "/tmp/$M-crossdep.log" 2>&1; then
              STATIC_RC=1
            fi
          done

          PLUGIN_JSON_RC=0
          test -f build/plugins.json || PLUGIN_JSON_RC=1

          {
            echo "TASKS_RC=$TASKS_RC"
            echo "BUILD_RC=$BUILD_RC"
            echo "MAKE_PLUGINS_JSON_RC=$MAKE_RC"
            echo "ADICINEMAX21_BUILD_RC=$Adicinemax21_RC"
            echo "ADIXTREAM_BUILD_RC=$AdiXtream_RC"
            echo "ADIDRAKOR_BUILD_RC=$AdiDrakor_RC"
            echo "ADIFILMSEMI_BUILD_RC=$AdiFilmSemi_RC"
            echo "STATIC_CROSS_PROVIDER_RC=$STATIC_RC"
            echo "PLUGINS_JSON_EXISTS_RC=$PLUGIN_JSON_RC"
            echo
            echo "=== makePluginsJson tail ==="
            tail -n 80 /tmp/make-plugins.log
            echo
            echo "=== full build tail ==="
            tail -n 80 /tmp/full-build.log
            for M in Adicinemax21 AdiXtream AdiDrakor AdiFilmSemi; do
              echo
              echo "=== $M build tail ==="
              tail -n 50 "/tmp/$M-build.log"
            done
            for M in AdiXtream AdiDrakor AdiFilmSemi; do
              if [ -s "/tmp/$M-crossdep.log" ]; then
                echo
                echo "=== $M cross dependency findings ==="
                cat "/tmp/$M-crossdep.log"
              fi
            done
          } > standalone-validation-result.txt

          if [ "$TASKS_RC" -ne 0 ] || [ "$BUILD_RC" -ne 0 ] || [ "$MAKE_RC" -ne 0 ] || \
             [ "$Adicinemax21_RC" -ne 0 ] || [ "$AdiXtream_RC" -ne 0 ] || [ "$AdiDrakor_RC" -ne 0 ] || \
             [ "$AdiFilmSemi_RC" -ne 0 ] || [ "$STATIC_RC" -ne 0 ] || [ "$PLUGIN_JSON_RC" -ne 0 ]; then
            echo "VALIDATION_RESULT=FAIL" >> standalone-validation-result.txt
          else
            echo "VALIDATION_RESULT=PASS" >> standalone-validation-result.txt
          fi

      - name: Publish validation result to branch
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add standalone-validation-result.txt
          git commit -m "Record standalone validation result" || exit 0
          git push
