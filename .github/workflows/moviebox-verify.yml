name: MovieBox Verify

on:
  push:
    branches:
      - fix/moviebox-high-quality-buffering
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch local.properties

      - name: Build plugin repository
        run: |
          chmod +x gradlew
          ./gradlew makePluginsJson --stacktrace

      - name: Verify MovieBox artifact exists
        run: |
          test -n "$(find Moviebox/build -maxdepth 2 -type f \( -name '*.cs3' -o -name '*.jar' \) -print -quit)"
