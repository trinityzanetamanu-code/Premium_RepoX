name: MovieBox v13 multistream test

on:
  push:
    branches:
      - fix/moviebox-high-quality-buffering
    paths:
      - '.github/workflows/moviebox-v13-multistream.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply playback patch
        run: python3 .github/scripts/moviebox_v13_patch.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'var foundStreams: List<StreamItem>' Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt
          test "$(grep -c 'override fun getVideoInterceptor' Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt)" -eq 0
          grep -q 'version = 13' Moviebox/build.gradle.kts

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt Moviebox/build.gradle.kts
          git commit -m "fix(moviebox): expose playback mirrors and keep native transport"
          git push origin HEAD:fix/moviebox-high-quality-buffering

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch local.properties

      - name: Build MovieBox v13
        run: |
          chmod +x gradlew
          ./gradlew :Moviebox:compileDebugKotlin :Moviebox:make --stacktrace

      - name: Verify package
        run: test -n "$(find Moviebox/build -maxdepth 1 -type f -name '*.cs3' -print -quit)"

      - name: Upload MovieBox v13
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-v13-phisher-style-test
          path: Moviebox/build/*.cs3
          if-no-files-found: error
          retention-days: 7
