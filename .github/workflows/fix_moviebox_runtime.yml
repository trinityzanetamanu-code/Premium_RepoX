name: Fix MovieBox runtime

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Patch MovieBox bearer fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt")
          text = path.read_text(encoding="utf-8")

          old_bootstrap = "        var bearerToken = fetchModernPlaybackBearer() ?: return false"
          new_bootstrap = "\n".join([
              "        var bearerToken = fetchModernPlaybackBearer()",
              "            ?: getBearerToken()",
              "            ?: return false",
          ])

          old_refresh = "                        val refreshed = fetchModernPlaybackBearer()"
          new_refresh = "\n".join([
              "                        val refreshed = fetchModernPlaybackBearer()",
              "                            ?: getBearerToken()",
          ])

          changed = False
          if old_bootstrap in text:
              text = text.replace(old_bootstrap, new_bootstrap, 1)
              changed = True
          elif new_bootstrap not in text:
              raise SystemExit("MovieBox bearer bootstrap anchor not found")

          if old_refresh in text:
              text = text.replace(old_refresh, new_refresh, 1)
              changed = True
          elif new_refresh not in text:
              raise SystemExit("MovieBox bearer refresh anchor not found")

          if changed:
              path.write_text(text, encoding="utf-8")
              print("MovieBox bearer fallback patched")
          else:
              print("MovieBox bearer fallback already present")
          PY

      - name: Commit patch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt
          if git diff --cached --quiet; then
            echo ">> Patch already present; nothing to commit."
            exit 0
          fi
          git commit -m "Fix MovieBox playback bearer fallback"
          git push origin HEAD:main
