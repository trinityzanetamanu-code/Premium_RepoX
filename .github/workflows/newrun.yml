name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Node 26 for REA
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Inspect turtle4up and kr21 sources and runtime requests
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,urllib.parse
          pages=[
            ("turtle4up","https://turtle4up.top/#owmx8n","https://turtle4up.top/assets/index-B_XTu8nA.js"),
            ("kr21","https://kr21.click/e/azyg0cfvg24r/siping-2026-h","https://kr21.click/assets/index-DocunfmE.js")
          ]
          def fetch(url,referer):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Chrome/134.0.0.0 Safari/537.36","Referer":referer})
              with urllib.request.urlopen(req,timeout=20) as res:return res.status,res.read(6000000).decode("utf-8","replace")
          for name,page,js in pages:
              print("HOST",name,"PAGE",page,flush=True)
              try:
                  status,s=fetch(js,page)
                  print("SCRIPT_HTTP",status,"SCRIPT_LEN",len(s),flush=True)
                  patterns=[".m3u8",".mp4","/api/","axios","fetch(","location.hash","window.location.hash","/e/","/embed/","videoUrl","streamUrl","getVideo","source","hls","token"]
                  for word in patterns:
                      matches=list(re.finditer(re.escape(word),s,re.I))
                      if matches:
                          print("SCRIPT_HITS",word,len(matches),flush=True)
                          for m in matches[:3]:
                              print("SCRIPT_CONTEXT",word,repr(s[max(0,m.start()-140):m.end()+210])[:400],flush=True)
                  urls=re.findall(r'https?://[A-Za-z0-9_.:/?&=%#@+-]+',s)
                  print("SCRIPT_URLS",list(dict.fromkeys(urls))[:55],flush=True)
              except Exception as exc:print("JS_FETCH_FAILED",type(exc).__name__,str(exc)[:180],flush=True)
          PY
          timeout 85s npm install -g rea-agents@latest --no-fund --no-audit > /tmp/rea-install.log 2>&1 || true
          if ! command -v rea >/dev/null; then echo 'REA_MISSING'; exit 0; fi
          CHROME=$(command -v google-chrome || command -v chromium)
          python3 - "$CHROME" <<'PY'
          import json,sys
          urls={
          "turtle":"https://turtle4up.top/#owmx8n",
          "kr21":"https://kr21.click/e/azyg0cfvg24r/siping-2026-h"
          }
          for name,url in urls.items():
              scenario={"browser":{"mode":"launch","executable_path":sys.argv[1]},"start_url":{"url":url},"actions":[{"step_id":"observe","action":"wait_for_timeout","duration_ms":5000}],"capture":{"events":["network"],"network":{"response_body":False},"at_end":["dom","url"]}}
              open("/tmp/kura-"+name+".json","w").write(json.dumps(scenario))
          PY
          for name in turtle kr21; do
            timeout 75s rea capture-browser-scenario "/tmp/kura-$name.json" --json >"/tmp/rea-$name.json" 2>"/tmp/rea-$name.err" || true
            python3 - "$name" <<'PY'
          import json,sys,urllib.parse
          name=sys.argv[1]
          try:
              n=json.load(open("/tmp/rea-"+name+".json")).get("normalized_result",{})
              print("REA_HOST",name,"STEPS",[(x.get("step_id"),x.get("status"),str(x.get("error"))[:150]) for x in n.get("steps",[])],flush=True)
              ev=n.get("events",{})
              items=ev.get("items",[]) if isinstance(ev,dict) else []
              print("REA_EVENTS",name,len(items),"COMPLETENESS",n.get("completeness"),flush=True)
              seen=set()
              for e in items:
                  url=e.get("url",{})
                  if isinstance(url,dict):url=url.get("url","")
                  if not isinstance(url,str) or not url.startswith("http"):continue
                  host=urllib.parse.urlparse(url).hostname or ""
                  if any(word in host for word in ["juicyads","jads.","chaseherbal","cloudflareinsights","googlesyndication","doubleclick","facebook","google-analytics","adservice","cdn-cgi","exoclick","a-ads","popcash"]):continue
                  key=(e.get("method"),url,e.get("status"))
                  if key in seen:continue
                  seen.add(key)
                  print("REA_REQUEST",name,"METHOD",e.get("method"),"HTTP",e.get("status"),"KIND",e.get("resource_type"),"URL",url[:450],flush=True)
                  if len(seen)>130:break
          except Exception as e:print("REA_HOST_FAILED",name,repr(e)[:300],flush=True)
          PY
          done
