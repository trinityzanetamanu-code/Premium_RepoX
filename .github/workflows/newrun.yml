name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect F4Stream iframe markup and JS playback config
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,html,collections,json
          targets=[
            ("F4_EMBED","https://k21cdn.click/e/ii111gel","https://kurakura21.com/ibu-kos-galak-kena-entot/"),
            ("F4_PLAYER_JS","https://f4stream.com/assets/client/js/player.js?v=1793204874","https://k21cdn.click/e/ii111gel"),
            ("TURTLE_API","https://turtle4up.top/api/stream?s=dvrj","https://turtle4up.top/dvrj"),
            ("BYSE_DETAILS","https://kr21.click/api/videos/a4g5v3xj6ltr/embed/details","https://kr21.click/e/a4g5v3xj6ltr/ibu-kos-kurakura21"),
            ("BYSE_SETTINGS","https://kr21.click/api/videos/a4g5v3xj6ltr/embed/settings","https://kr21.click/e/a4g5v3xj6ltr/ibu-kos-kurakura21"),
          ]
          for label,u,ref in targets:
            h={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36","Accept":"*/*","Referer":ref}
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=22) as rr:body=rr.read(1200000).decode("utf-8","replace");st=rr.status;ct=rr.headers.get("Content-Type")
              print("TARGET",label,"HTTP",st,"CT",ct,"LEN",len(body),flush=True)
              if label=="F4_EMBED":
                print("MARKUP_BEGIN",body[:5900],flush=True)
              elif label=="F4_PLAYER_JS":
                patterns=["sources","source","file:","url:","api","getPlayer","xhr","play","mp4","m3u8","atob","fetch(","ajax","token"]
                for p in patterns:
                  hits=list(re.finditer(re.escape(p),body,re.I))
                  if hits:
                    print("JS_HITS",p,len(hits),flush=True)
                    for m in hits[:2]:print("JS_CONTEXT",p,repr(body[max(0,m.start()-130):m.end()+280])[:550],flush=True)
                print("JS_URLS",list(dict.fromkeys(re.findall(r'https?://[a-zA-Z0-9.:-]+(?:/[^\s"\x27<>]*)?',body)))[:35],flush=True)
              else:
                try:
                  obj=json.loads(body)
                  def shape(obj):
                    if isinstance(obj,dict):return {k:shape(v) for k,v in obj.items()}
                    if isinstance(obj,list):return [shape(v) for v in obj[:3]]
                    if isinstance(obj,str):
                      if obj.startswith("http"):return "URL HOST "+str(urllib.parse.urlsplit(obj).hostname)
                      return obj[:140]
                    return obj
                  print("API_RESULT",label,str(shape(obj))[:2200],flush=True)
                except Exception:print("API_RAW",label,body[:1500],flush=True)
            except Exception as e:print("ERROR",label,type(e).__name__,str(e)[:200],flush=True)
          PY
      - name: Inspect F4Stream browser DOM and media requests
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo NO_CHROME; exit 0; fi
          timeout 28s "$CHROME" --no-sandbox --headless --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom "https://k21cdn.click/e/ii111gel" > /tmp/f4-dom.html 2>/tmp/f4err || true
          python3 - <<'PY'
          import re
          s=open("/tmp/f4-dom.html").read()
          print("DOM_SIZE",len(s),flush=True)
          for w in ['<video','<source','src="','m3u8','mp4','iframe','jwplayer','plyr','hls','play','captcha','token']:
            ms=list(re.finditer(re.escape(w),s,re.I))
            if ms:
              print("DOM_MATCH",w,len(ms),flush=True)
              for m in ms[:3]:print("DOM_CONTEXT",w,repr(s[max(0,m.start()-130):m.end()+350])[:550],flush=True)
          PY
