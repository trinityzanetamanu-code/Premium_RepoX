name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node for REA
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: REA click through Turtle4Up player overlay
        shell: bash
        run: |
          timeout 100s npm install -g rea-agents@latest --no-fund --no-audit > /tmp/rea-install.log 2>&1 || true
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ ! -x "$(command -v rea)" ] || [ -z "$CHROME" ]; then echo REA_NOT_AVAILABLE; exit 0; fi
          python3 - "$CHROME" <<'PY'
          import json,sys
          scenarios=[
            ("click",[
              {"step_id":"warm","action":"wait_for_timeout","duration_ms":1400},
              {"step_id":"click_play","action":"click","locator":{"kind":"css","selector":"#player-button-container"},"timeout_ms":11000},
              {"step_id":"observe","action":"wait_for_timeout","duration_ms":3500}
            ]),
            ("baseline",[{"step_id":"observe","action":"wait_for_timeout","duration_ms":4500}])
          ]
          for name,acts in scenarios:
            s={"browser":{"mode":"launch","executable_path":sys.argv[1]},"start_url":{"url":"https://turtle4up.top/bsvh"},"actions":acts,"capture":{"events":["network"],"network":{"request_body":False,"response_body":False},"at_end":["dom","url"]}}
            open("/tmp/kura-"+name+".json","w").write(json.dumps(s))
          PY
          for name in click baseline; do
            timeout 70s rea capture-browser-scenario "/tmp/kura-$name.json" --json >/tmp/rea-$name.json 2>/tmp/rea-$name.log || true
            python3 - "$name" <<'PY'
          import json,sys,urllib.parse
          name=sys.argv[1]
          try:
            n=json.load(open("/tmp/rea-"+name+".json")).get("normalized_result",{})
            print("SCENARIO",name,"STEPS",[(x.get("step_id"),x.get("status"),str(x.get("error"))[:100]) for x in n.get("steps",[])],flush=True)
            seen=set()
            ev=n.get("events") or {}
            for e in ev.get("items",[])[:650]:
              raw=e.get("url") or {}
              u=raw.get("url","") if isinstance(raw,dict) else raw
              if not isinstance(u,str) or not u.startswith("http"):continue
              host=urllib.parse.urlsplit(u).hostname or ""
              if host.endswith(("doubleclick.net","googlesyndication.com","cloudflareinsights.com","jads.co","imasdk.googleapis.com","google.com")):continue
              key=(e.get("method"),u,e.get("status"))
              if key in seen:continue
              seen.add(key)
              print("NETWORK",name,e.get("method"),e.get("status"),e.get("resource_type"),u[:500],flush=True)
          except Exception as ex:print("SCENARIO_ERROR",name,repr(ex)[:180],flush=True)
          PY
            tail -c 450 /tmp/rea-$name.log
          done
