name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 26 for REA
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Inspect real player HTML, Chromium DOM, and REA
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from html.parser import HTMLParser
          targets=["https://kurakura21.com/sub-indo-siping-2026/","https://kurakura21.com/sub-indo-jur-770-nanami-mihi/"]
          class P(HTMLParser):
              def __init__(self):super().__init__();self.tags=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ["iframe","video","source"] or any(x in str(d).lower() for x in ["player","server","dooplay","option"]):
                      useful={k:v for k,v in attrs if k in ["src","data-src","data-url","data-embed","data-post","data-nume","data-type","data-player","href","id","class","onclick"]}
                      if useful and len(self.tags)<40:self.tags.append((tag,useful))
          for url in targets:
              print("TEST URL",url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/134.0.0.0 Safari/537.36"})
                  with urllib.request.urlopen(req,timeout=18) as f:
                      txt=f.read(1500000).decode("utf-8","replace")
                      print("HTTP",f.status,"FINAL",f.url,"LEN",len(txt),flush=True)
                      p=P();p.feed(txt)
                      for tag in p.tags:print("TAG",str(tag)[:520],flush=True)
                      for word in ["SERVER 1","dooplay_player","doo_player_ajax","playeroptions","wp-json","iframe","player","server","data-post","data-nume"]:
                          print("MATCH",word,len(re.findall(re.escape(word),txt,re.I)),flush=True)
                          m=re.search(re.escape(word),txt,re.I)
                          if m:print("CONTEXT",repr(txt[max(0,m.start()-130):m.end()+290])[:470],flush=True)
                      print("JS",re.findall(r'<script[^>]*src=["\']([^"\']+)',txt,re.I)[-12:],flush=True)
              except Exception as exc: print("FAIL",type(exc).__name__,str(exc)[:180],flush=True)
          PY
          CHROME=$(command -v google-chrome || command -v chromium || true)
          echo "CHROME=$CHROME"
          if [ -n "$CHROME" ]; then
            timeout 35s "$CHROME" --no-sandbox --headless --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8500 --dump-dom "https://kurakura21.com/sub-indo-siping-2026/" > /tmp/kurakura_dom.html 2>/tmp/kurakura_chrome.log || true
            echo "BROWSER_DOM_BYTES=$(wc -c < /tmp/kurakura_dom.html)"
            grep -Eoi '.{0,130}(iframe|playeroptions|data-nume|data-post|SERVER 1|dooplay).{0,200}' /tmp/kurakura_dom.html | head -40 || true
          fi
          if timeout 95s npm install -g rea-agents@latest --no-fund --no-audit >/tmp/rea-install.log 2>&1; then
            echo "REA_INSTALLED=$(command -v rea || true)"
            if command -v rea >/dev/null 2>&1 && [ -n "$CHROME" ]; then
              python3 - "$CHROME" <<'PY'
          import json,sys
          scenario={"browser":{"mode":"launch","executable_path":sys.argv[1]},"start_url":{"url":"https://kurakura21.com/sub-indo-siping-2026/"},"actions":[{"step_id":"dom_ready","action":"wait_for_timeout","duration_ms":1200}],"capture":{"events":["network"],"network":{"response_body":False},"at_end":["dom","url"]}}
          open("/tmp/kura_rea_scenario.json","w").write(json.dumps(scenario))
          PY
              timeout 80s rea capture-browser-scenario /tmp/kura_rea_scenario.json --json >/tmp/kura_rea.json 2>/tmp/kura_rea.err || true
              echo "REA_RESULT_BYTES=$(wc -c < /tmp/kura_rea.json)"
              head -c 3000 /tmp/kura_rea.json
              echo
              tail -c 900 /tmp/kura_rea.err
            fi
          else
            echo "REA_INSTALL_FAILED"
            tail -c 1000 /tmp/rea-install.log
          fi
