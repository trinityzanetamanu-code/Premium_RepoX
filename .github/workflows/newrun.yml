name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Siapkan branch builds (buat ulang kalau terhapus)
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            echo ">> Branch 'builds' ditemukan, checkout..."
            git fetch origin builds:builds
            git checkout builds
          else
            echo ">> Branch 'builds' TIDAK ADA. Membuat ulang sebagai orphan branch..."
            git checkout --orphan builds
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          fi

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Apply MovieBox API3 legacy play-info fallback
        run: |
          cd "$GITHUB_WORKSPACE/src"
          OLD_B64=''
          NEW_B64=''
          python3 - "$OLD_B64" "$NEW_B64" <<'PY'
          import base64, sys
          from pathlib import Path
          path = Path("Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt")
          text = path.read_text(encoding="utf-8")
          old = base64.b64decode(sys.argv[1]).decode("utf-8")
          new = base64.b64decode(sys.argv[2]).decode("utf-8")
          if old not in text:
              if "[PLAYBACK-LEGACY-FALLBACK]" in text:
                  print("fallback already present")
                  raise SystemExit(0)
              raise SystemExit("MovieBox play-info anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("MovieBox API3 legacy fallback applied")
          PY
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Moviebox/src/main/kotlin/com/Moviebox/MovieboxProvider.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix MovieBox API3 legacy play-info fallback"
            git push origin HEAD:main
          fi

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            if git diff --cached --quiet; then
              echo ">> Tidak ada perubahan, skip push."
              exit 0
            fi
            git commit --amend -m "Build $GITHUB_SHA"
          else
            git commit -m "Build $GITHUB_SHA"
          fi

          git push --force origin builds
