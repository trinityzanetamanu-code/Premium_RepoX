name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect video APIs without changing plugin
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re,urllib.parse
          tests=[
            ("turtle_bsvh","https://turtle4up.top/api/stream?s=bsvh","https://turtle4up.top/#bsvh"),
            ("turtle_owmx","https://turtle4up.top/api/stream?s=owmx8n","https://turtle4up.top/#owmx8n"),
            ("kr21_details","https://kr21.click/api/videos/5yv3qi26pz3u/embed/details","https://kr21.click/e/5yv3qi26pz3u/watch-3011-melly-1"),
            ("kr21_settings","https://kr21.click/api/videos/5yv3qi26pz3u/embed/settings","https://kr21.click/e/5yv3qi26pz3u/watch-3011-melly-1"),
            ("kr21_sukdulan","https://kr21.click/api/videos/bv5xc0betyls/embed/settings","https://kr21.click/e/bv5xc0betyls/sukdulan"),
          ]
          for name,url,ref in tests:
            h={"User-Agent":"Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 Chrome/131.0.0.0 Mobile Safari/537.36","Referer":ref,"Origin":ref.split('/')[0]+"//"+ref.split('/')[2],"Accept":"application/json, text/plain, */*"}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=15) as r:
                body=r.read(120000).decode("utf-8","replace")
                print("TEST",name,"STATUS",r.status,"CTYPE",r.headers.get("Content-Type"),"LENGTH",len(body),flush=True)
                try:
                  j=json.loads(body)
                  def shape(v,depth=0):
                    if depth>3:return type(v).__name__
                    if isinstance(v,dict):return {k:shape(val,depth+1) for k,val in v.items()}
                    if isinstance(v,list):return [shape(x,depth+1) for x in v[:2]]
                    if isinstance(v,str):return v[:70] if not v.startswith("http") else "(URL) "+str(urllib.parse.urlsplit(v).hostname)
                    return v
                  print("JSON",name,str(shape(j))[:3300],flush=True)
                except Exception:print("RAW",name,repr(body[:450]),flush=True)
            except urllib.error.HTTPError as e:print("HTTP_ERROR",name,e.code,repr(e.read(300).decode("utf-8","replace")),flush=True)
            except Exception as e:print("ERROR",name,repr(e)[:350],flush=True)
          for host,url in [
            ("kr21","https://kr21.click/assets/videoPagesBundle-Bgi0QmPo.js"),
            ("turtle","https://turtle4up.top/assets/index-B_XTu8nA.js")
          ]:
            try:
              with urllib.request.urlopen(url,timeout=15) as r:s=r.read(600000).decode("utf-8","replace")
              print("JS",host,"SIZE",len(s),flush=True)
              pattern=r'/(?:api|embed|player|stream|videos)/[a-zA-Z0-9_$?={}.+/\-]*'
              paths=list(dict.fromkeys(re.findall(pattern,s)))
              print("PATHS",host,paths[:40],flush=True)
              for word in ["embed/details","embed/settings","stream_url","sources","captcha_required","/api/stream?s=","/api/videos/stream/"]:
                p=0
                for m in list(re.finditer(re.escape(word),s,re.I))[:2]:
                  print("CONTEXT",host,word,repr(s[max(0,m.start()-200):m.end()+310])[:620],flush=True)
            except Exception as e:print("JS_ERROR",host,repr(e)[:250],flush=True)
          PY
