name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Muvipro AJAX and embedded host
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,html
          pages=[
            "https://kurakura21.com/sub-indo-siping-2026/",
            "https://kurakura21.com/sub-indo-jur-770-nanami-mihi/"
          ]
          def fetch(url,data=None,referer=None):
              h={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/134.0.0.0 Safari/537.36","Referer":referer or "https://kurakura21.com/","Accept":"*/*"}
              if data is not None:h["Content-Type"]="application/x-www-form-urlencoded; charset=UTF-8";h["X-Requested-With"]="XMLHttpRequest"
              req=urllib.request.Request(url,data=urllib.parse.urlencode(data).encode() if data else None,headers=h)
              with urllib.request.urlopen(req,timeout=18) as r:return r.status,r.read(1000000).decode("utf-8","replace"),r.url
          for page in pages:
              print("PAGE",page,flush=True)
              try:
                  code,markup,_=fetch(page)
                  m=re.search(r'id="muvipro_player_content_id"[^>]*data-id="(\d+)"',markup)
                  print("PAGE_STATUS",code,"ID",m.group(1) if m else "NOT_FOUND",flush=True)
                  if not m:continue
                  tabs=re.findall(r'<a href="#(p\d+)"[^>]*>([^<]+)',markup,re.I)
                  print("TABS",tabs,flush=True)
                  for tab,label in tabs:
                      post={"action":"muvipro_player_content","tab":tab,"post_id":m.group(1)}
                      try:
                          status,body,final=fetch("https://kurakura21.com/wp-admin/admin-ajax.php",post,page)
                          print("AJAX",tab,label,"STATUS",status,"LEN",len(body),"HTML",repr(body[:1800]),flush=True)
                          urls=re.findall(r'<iframe[^>]+src=["\x27]([^"\x27]+)',body,re.I)
                          print("IFRAMES",tab,urls[:8],flush=True)
                          for target in urls[:2]:
                              print("EMBED",target,flush=True)
                              try:
                                  st,raw,_=fetch(target,referer=page)
                                  print("EMBED_STATUS",st,"SIZE",len(raw),"START",repr(raw[:650]),flush=True)
                                  print("PLAYER_SCRIPT_PATHS",re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',raw,re.I)[-12:],flush=True)
                                  for pattern in ["jwplayer","m3u8","mp4","file:","source:","location.hash","atob","eval(","fetch(","axios","window.location","hls.js"]:
                                      hits=list(re.finditer(re.escape(pattern),raw,re.I))
                                      if hits:print("EMBED_MATCH",pattern,len(hits),repr(raw[max(0,hits[0].start()-100):hits[0].end()+240])[:380],flush=True)
                              except Exception as e:print("EMBED_ERROR",type(e).__name__,str(e)[:200],flush=True)
                      except Exception as e:print("AJAX_ERROR",tab,type(e).__name__,str(e)[:200],flush=True)
              except Exception as e:print("PAGE_ERROR",type(e).__name__,str(e)[:200],flush=True)
          PY
