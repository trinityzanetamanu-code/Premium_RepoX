name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_NAME: "Premium_RepoX"
  REPO_DESC: "CloudStream Premium Repository"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: "src"

      - name: Checkout repo untuk folder builds
        uses: actions/checkout@v7
        with:
          path: "builds"

      - name: Checkout existing builds branch
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git ls-remote --exit-code --heads origin builds >/dev/null
          git fetch origin builds
          git checkout --detach FETCH_HEAD
          cp plugins.json "$RUNNER_TEMP/plugins-before.json"

      - name: Bersihkan build lama
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Create local.properties
        run: |
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties

      - name: Detect KuraKura21-only push
        id: scope
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$before"; then
            exit 0
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ] && \
             ! grep -Ev '^(KuraKura21/|\.github/workflows/(newrun|clear-cache)\.yml$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "kura_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify isolated H5 ports and original Moviebox regression
        if: steps.scope.outputs.kura_only != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/run_migration.py

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          if [ "${{ steps.scope.outputs.kura_only }}" = "true" ]; then
            # Compile the changed provider first; leave existing provider sources untouched.
            ./gradlew :KuraKura21:make
          else
            ./gradlew :AdiDrakor:assembleRelease :AdiFilmSemi:assembleRelease :AdiXtream:assembleRelease :Adicinemax21:assembleRelease
          fi
          ./gradlew makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds" || true
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds" || true
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Verify plugin artifacts and catalog preservation
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 AdiDrakor/tests/verify_artifacts.py "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/plugins-before.json"

      - name: Buat ulang repo.json kalau hilang
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          if [ -f "repo.json" ]; then
            echo ">> repo.json sudah ada, tidak diubah."
            exit 0
          fi

          echo ">> repo.json hilang, membuat ulang..."
          cat > repo.json << EOF
          {
            "name": "$REPO_NAME",
            "description": "$REPO_DESC",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/builds/plugins.json"
            ]
          }
          EOF
          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f "plugins.json" ]; then
            echo "BAHAYA: plugins.json tidak terbentuk. Membatalkan proses."
            exit 1
          fi
          if [ ! -f "repo.json" ]; then
            echo "BAHAYA: repo.json hilang! Membatalkan proses."
            exit 1
          fi
          if ! ls ./*.cs3 >/dev/null 2>&1; then
            echo "BAHAYA: tidak ada file .cs3 sama sekali. Membatalkan proses."
            exit 1
          fi

          echo ">> Total file .cs3: $(ls -1 ./*.cs3 | wc -l)"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo ">> Tidak ada perubahan, skip push."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds

  probe:
    if: contains(github.event.head_commit.message, '[probe-only]')
    runs-on: ubuntu-latest
    steps:
      - name: Test documented player endpoint using normal browser headers
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar
          code="azyg0cfvg24r"
          cases=[
          ("kr21-view","https://kr21.click/e/"+code+"/siping-2026-h","https://kurakura21.com/sub-indo-siping-2026/"),
          ("n1mwq-view","https://n1mwq.org/gch4/"+code,"https://kr21.click/e/"+code+"/siping-2026-h"),
          ("n1mwq-settings","https://n1mwq.org/api/videos/"+code+"/embed/settings","https://n1mwq.org/gch4/"+code),
          ("n1mwq-details","https://n1mwq.org/api/videos/"+code+"/embed/details","https://n1mwq.org/gch4/"+code),
          ("kr21-settings","https://kr21.click/api/videos/"+code+"/embed/settings","https://kr21.click/e/"+code+"/siping-2026-h"),
          ]
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          for label,url,referer in cases:
              h={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/135.0.0.0 Safari/537.36","Accept":"application/json, text/plain, */*","Referer":referer,"Origin":url.split('/')[0]+"//"+url.split('/')[2],"Sec-Fetch-Site":"same-origin","Sec-Fetch-Mode":"cors"}
              try:
                  r=opener.open(urllib.request.Request(url,headers=h),timeout=14)
                  data=r.read(140000).decode("utf-8","replace")
                  print("CASE",label,"HTTP",r.status,"CTYPE",r.headers.get("Content-Type"),"COOKIE_COUNT",len(jar),"BODY",repr(data[:5000]),flush=True)
              except Exception as e:
                  if isinstance(e,urllib.error.HTTPError):
                      print("CASE",label,"HTTP",e.code,"BODY",repr(e.read(600).decode("utf-8","replace")),flush=True)
                  else:print("CASE",label,"ERROR",repr(e),flush=True)
          PY
